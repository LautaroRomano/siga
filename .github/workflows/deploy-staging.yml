name: Deploy staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.alias.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrar base de datos de staging
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @repo/db migrate:deploy

      - name: Deploy en Vercel (build en la nube)
        id: deploy
        run: |
          url=$(pnpm dlx vercel@59 deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Asignar alias de staging
        id: alias
        run: |
          pnpm dlx vercel@59 alias set "${{ steps.deploy.outputs.url }}" "${{ vars.STAGING_DOMAIN }}" --token="$VERCEL_TOKEN"
          echo "url=https://${{ vars.STAGING_DOMAIN }}" >> "$GITHUB_OUTPUT"
